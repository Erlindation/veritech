<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeriTech – Mis afirmaciones</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page">

    <header class="topbar">
        <span class="logo">VeriTech</span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
    </header>

    <main class="container">
        <h2>Mis afirmaciones</h2>

        <div class="card new-claim">
            <h3>Nueva afirmación</h3>
            <form id="form-create" onsubmit="handleCreate(event)">
                <div class="field row">
                    <input type="text" id="claim-text" required placeholder="Escribe aquí la afirmación a verificar..." class="input-wide">
                    <button type="submit" class="btn-primary">Verificar</button>
                </div>
                <p class="error hidden" id="create-error"></p>
            </form>
        </div>

        <div class="card">
            <p class="api-notice">Los veredictos provienen de fact-checks publicados por terceros y pueden no coincidir exactamente con la afirmación introducida.</p>
            <table id="claims-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Afirmación</th>
                        <th>Veredicto</th>
                        <th>Fuente</th>
                        <th>Fecha</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="claims-body">
                    <tr><td colspan="6" class="empty">Cargando...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script type="module">
        import { getClaims, createClaim, updateClaim, deleteClaim } from './api.js';

        if (!localStorage.getItem('token')) {
            window.location.href = 'index.html';
        }

        window.logout = function() {
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        };

        function verdictBadge(verdict) {
            if (!verdict) return '<span class="badge badge-unknown">—</span>';
            const v = verdict.toLowerCase();
            if (v.includes('falso') || v.includes('false') || v.includes('incorrect') || v.includes('mislead')) {
                return `<span class="badge badge-false">${verdict}</span>`;
            }
            if (v.includes('verdadero') || v.includes('true') || v.includes('correct') || v.includes('accurate')) {
                return `<span class="badge badge-true">${verdict}</span>`;
            }
            return `<span class="badge badge-unknown">${verdict}</span>`;
        }

        function rowActions(id) {
            return `
                <button onclick="handleEdit(${id})" class="btn-edit">Editar</button>
                <button onclick="handleDelete(${id})" class="btn-delete">Eliminar</button>
            `;
        }

        async function loadClaims() {
            const tbody = document.getElementById('claims-body');
            try {
                const claims = await getClaims();
                if (claims.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="6" class="empty">Todavía no has enviado ninguna afirmación.</td></tr>';
                    return;
                }
                tbody.innerHTML = claims.map(c => `
                    <tr id="row-${c.id}">
                        <td>${c.id}</td>
                        <td class="claim-text">${c.text}</td>
                        <td>${verdictBadge(c.verdict)}</td>
                        <td>${c.source ? `<a href="${c.source}" target="_blank" class="source-link">Ver fuente</a>` : '<span class="no-source">—</span>'}</td>
                        <td>${new Date(c.created_at).toLocaleDateString('es-ES')}</td>
                        <td class="actions">${rowActions(c.id)}</td>
                    </tr>
                `).join('');
            } catch {
                tbody.innerHTML = '<tr><td colspan="6" class="empty error">Error al cargar las afirmaciones.</td></tr>';
            }
        }

        window.handleCreate = async function(e) {
            e.preventDefault();
            const input = document.getElementById('claim-text');
            const errorEl = document.getElementById('create-error');
            errorEl.classList.add('hidden');
            try {
                await createClaim(input.value);
                input.value = '';
                await loadClaims();
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.classList.remove('hidden');
            }
        };

        window.handleEdit = function(id) {
            const row = document.getElementById(`row-${id}`);
            const textCell = row.querySelector('.claim-text');
            row.dataset.originalText = textCell.textContent;
            textCell.innerHTML = '<input type="text" class="edit-input">';
            textCell.querySelector('input').value = row.dataset.originalText;
            textCell.querySelector('input').focus();
            row.querySelector('.actions').innerHTML = `
                <button onclick="saveEdit(${id})" class="btn-save">Guardar</button>
                <button onclick="cancelEdit(${id})" class="btn-cancel">Cancelar</button>
            `;
        };

        window.saveEdit = async function(id) {
            const row = document.getElementById(`row-${id}`);
            const newText = row.querySelector('.edit-input').value.trim();
            if (!newText) return;
            try {
                await updateClaim(id, newText);
                await loadClaims();
            } catch {
                cancelEdit(id);
                alert('No se pudo guardar el cambio.');
            }
        };

        window.cancelEdit = function(id) {
            const row = document.getElementById(`row-${id}`);
            row.querySelector('.claim-text').textContent = row.dataset.originalText;
            row.querySelector('.actions').innerHTML = rowActions(id);
        };

        window.handleDelete = async function(id) {
            if (!confirm('¿Eliminar esta afirmación?')) return;
            try {
                await deleteClaim(id);
                document.getElementById(`row-${id}`).remove();
            } catch {
                alert('No se pudo eliminar.');
            }
        };

        loadClaims();
    </script>
</body>
</html>
